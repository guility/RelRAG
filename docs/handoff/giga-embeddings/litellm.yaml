model_list:
  - model_name: giga-document-v1
    litellm_params:
      model: openai/giga-document-v1
      api_base: http://giga-embedding:8000/v1
      api_key: local-embedding-no-auth
      timeout: 120
      num_retries: 0
  - model_name: giga-query-v1
    litellm_params:
      model: openai/giga-query-v1
      api_base: http://giga-embedding:8000/v1
      api_key: local-embedding-no-auth
      timeout: 120
      num_retries: 0

litellm_settings:
  turn_off_message_logging: true
  set_verbose: false
  cache: false
  num_retries: 0

general_settings:
  disable_model_info_refresh: true

router_settings:
  num_retries: 0
